# ardustep.ini -- minimal 3-axis (XYZ) LinuxCNC config for the USB Arduino
# step generator. Servo-only (no software base thread: the Arduino makes the
# pulses, not LinuxCNC). FERROR is deliberately loose -- the USB link is not
# real-time, so following error must tolerate the jitter.

[EMC]
VERSION = 1.1
MACHINE = ardustep
DEBUG = 0

[DISPLAY]
DISPLAY = axis
CYCLE_TIME = 0.1
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.2
PROGRAM_PREFIX = ~/linuxcnc/nc_files
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 2
EDITOR = gedit

[KINS]
KINEMATICS = trivkins coordinates=XYZ
JOINTS = 3

[EMCMOT]
EMCMOT = motmod
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = ardustep.var

[HAL]
HALFILE = ardustep.hal

[TRAJ]
COORDINATES = XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 20.0
MAX_LINEAR_VELOCITY = 50.0
# Allow jogging before homing -- handy while bringing the rig up on the bench.
NO_FORCE_HOMING = 1

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = ardustep.tbl

# ---- axes ---------------------------------------------------------------------
# MAX_VELOCITY here is bounded by the AVR step ceiling. With 200 steps/mm a
# v2's distinct-edge ceiling is 15 ksteps/s. At 200 steps/mm that is 75 mm/s;
# these 50 mm/s defaults retain a conservative margin.

[AXIS_X]
MAX_VELOCITY = 50.0
MAX_ACCELERATION = 500.0
MIN_LIMIT = -150.0
MAX_LIMIT = 150.0

[AXIS_Y]
MAX_VELOCITY = 50.0
MAX_ACCELERATION = 500.0
MIN_LIMIT = -150.0
MAX_LIMIT = 150.0

[AXIS_Z]
MAX_VELOCITY = 50.0
MAX_ACCELERATION = 500.0
MIN_LIMIT = -100.0
MAX_LIMIT = 0.0

# ---- joints -------------------------------------------------------------------
# FERROR loose on purpose; tighten once you have measured your real jitter.

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 50.0
MAX_ACCELERATION = 500.0
FERROR = 5.0
MIN_FERROR = 2.5
MIN_LIMIT = -150.0
MAX_LIMIT = 150.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
HOME_SEQUENCE = 0

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 50.0
MAX_ACCELERATION = 500.0
FERROR = 5.0
MIN_FERROR = 2.5
MIN_LIMIT = -150.0
MAX_LIMIT = 150.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
HOME_SEQUENCE = 1

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 50.0
MAX_ACCELERATION = 500.0
FERROR = 5.0
MIN_FERROR = 2.5
MIN_LIMIT = -100.0
MAX_LIMIT = 0.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
HOME_SEQUENCE = 2
