; PlatformIO build for the ardustep firmware.
;
;   cd firmware/ardustep
;   pio run                       # build the default (nano, old bootloader)
;   pio run -e uno                # build for an Uno instead
;   pio run -e nano -t upload     # build + flash (set upload_port below)
;   pio device monitor            # 1 Mbaud serial monitor
;
; src_dir = . so PlatformIO compiles ardustep.ino + stepgen.cpp from this folder
; (it auto-converts the .ino to C++ and picks up the local headers).

[platformio]
src_dir = .

[env]
platform = atmelavr
framework = arduino
monitor_speed = 1000000
build_flags = -O2

; Classic Nano clone (FT232/CH340), "old" bootloader @ 57600 upload baud.
[env:nano]
board = nanoatmega328
upload_port = /dev/ttyUSB0

; Newer Nano with the optiboot bootloader (115200 upload baud).
[env:nano_new]
board = nanoatmega328new
upload_port = /dev/ttyUSB0

; Genuine Arduino Uno (usually enumerates as /dev/ttyACM0).
[env:uno]
board = uno
upload_port = /dev/ttyACM0
