name: test-and-build

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: >-
          python -m py_compile linuxcnc/protocol.py linuxcnc/ardustep.py
          tools/bench_test.py tools/plot_bench.py
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build all ATmega328P targets
        working-directory: firmware/ardustep
        run: pio run -e nano -e nano_new -e uno
